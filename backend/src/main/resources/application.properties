spring.application.name=yatraindia-backend

# MySQL Database
spring.datasource.url=jdbc:mysql://localhost:3306/yatraindia
spring.datasource.username=root
spring.datasource.password=${YATRAINDIA_DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
L
# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Actuator
management.endpoints.web.exposure.include=health,info
# YatraIndia Server
server.port=8082
logging.level.org.springframework.security=DEBUG
yatraindia.jwt.expiration=86400000
yatraindia.jwt.secret=${YATRAINDIA_JWT_SECRET}
